name: Render CV and Deploy to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - "cv.yaml"
            - "theme.yaml"
            - "design.yaml"
            - ".github/workflows/render-cv.yml"
            - ".github/workflows/render-cv.local.yml"
            - "assets/**"
    workflow_dispatch:

concurrency:
    group: "pages-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: false

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install RenderCV
              run: pip install "rendercv[full]==2.8"

            - name: Check cv.yaml exists
              run: |
                  if [ ! -f cv.yaml ]; then
                    echo "::error::cv.yaml not found at repository root"
                    exit 1
                  fi

            - name: Render CV
              run: rendercv render cv.yaml

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Prepare deployment directory
              run: |
                  mkdir -p _site
                  for f in rendercv_output/*.html; do
                    mv "$f" _site/index.html
                  done
                  find rendercv_output -maxdepth 1 -type f ! -name "*.html" -exec cp {} _site/ \;
                  find rendercv_output -maxdepth 1 -mindepth 1 -type d -exec cp -r {} _site/ \;
                  touch _site/.nojekyll

            - name: Inject download bar
              run: |
                  python3 - <<'PYEOF'
                  from pathlib import Path
                  bar = '<div style="text-align:right;margin:0 0 16px 0"><a href="/Man_Pak_Ki_Issac_CV.pdf">PDF</a> &middot; <a href="/Man_Pak_Ki_Issac_CV.md">Markdown</a> &middot; <a href="/Man_Pak_Ki_Issac_CV_1.png">PNG</a> &middot; <a href="/Man_Pak_Ki_Issac_CV.typ">Typ</a></div>'
                  p = Path("_site/index.html")
                  p.write_text(p.read_text(encoding="utf-8").replace('<article class="markdown-body">', f'<article class="markdown-body">{bar}', 1), encoding="utf-8")
                  PYEOF

            - name: Set HTML title
              run: python3 -c "from pathlib import Path; p=Path('_site/index.html'); p.write_text(p.read_text(encoding='utf-8').replace('<title>', '<title>CV &middot; Issac Man', 1), encoding='utf-8')"

            - name: Verify deployment files
              run: |
                  if [ ! -f _site/index.html ]; then
                    echo "::error::_site/index.html was not generated. Check that RenderCV produced an HTML file in rendercv_output/"
                    ls -la _site/
                    exit 1
                  fi
                  ls -la _site/

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Upload downloadable build
              uses: actions/upload-artifact@v4
              with:
                  name: cv-files
                  path: rendercv_output/
                  retention-days: 30
                  if-no-files-found: error

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
